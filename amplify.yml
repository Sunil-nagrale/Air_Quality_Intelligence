version: 1
# AWS Amplify Build Specification for Air Quality Intelligence Frontend
# Canonical Environment Variables Configured in Amplify Console (Zero Secrets):
# - VITE_API_BASE_URL: Regional API Gateway URL from CloudFormation output ApiUrl
# - VITE_COGNITO_USER_POOL_ID: UserPoolId from CloudFormation output UserPoolId
# - VITE_COGNITO_CLIENT_ID: UserPoolClientId from CloudFormation output UserPoolClientId
# - VITE_AWS_REGION: ap-south-1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
